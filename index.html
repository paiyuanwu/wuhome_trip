<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>吳家日本東京・富士秋季行 2026.10.02–10.09</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
  :root {
    --ink: #1F2A3D;
    --ink-soft: #5B6478;
    --paper: #F8F9FA;
    --paper-2: #EDF1F5;
    --card: #FFFFFF;
    --accent: #E25B36;
    --accent-2: #D19142;
    --line: #E5E9F0;
    --green: #408A63;
    --blue: #2B6CB0;
    --shadow: 0 6px 16px rgba(31, 42, 61, 0.06);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(56px + var(--safe-bottom));
    min-height: 100vh;
  }
  h1, h2, h3, .serif { font-family: "Noto Serif TC", serif; }
  ::selection { background: #FDE8E1; color: var(--accent); }

  /* ---------- HERO ---------- */
  .hero {
    background: linear-gradient(145deg, #2C3E50 0%, #1A2536 100%);
    color: #FFF;
    padding: 16px 16px 14px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; right: -30px; top: -30px;
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle, rgba(226,91,54,0.4) 0%, rgba(226,91,54,0) 70%);
  }
  .hero::after {
    content: ""; position: absolute; left: -20px; bottom: -50px;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(209,145,66,0.3) 0%, rgba(209,145,66,0) 70%);
  }
  .hero .eyebrow {
    font-size: 11px; letter-spacing: 0.1em; color: #F0C48D; margin: 0 0 4px;
    position: relative; z-index: 1; font-weight: 800;
  }
  .hero h1 {
    font-size: 22px; line-height: 1.3; margin: 0 0 6px; font-weight: 900;
    position: relative; z-index: 1;
  }
  .hero p.dates {
    margin: 0; font-size: 12px; color: #D1D8E5; position: relative; z-index: 1;
    display: flex; align-items: center; gap: 4px; font-weight: 500;
  }
  .hero p.dates::before { content: "◆"; color: var(--accent); font-size: 8px; }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.05);
    padding-bottom: var(--safe-bottom);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
  }
  .bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: none; border: none; padding: 8px 4px;
    color: #A0ABC0; font-size: 11px; font-weight: 700; cursor: pointer; position: relative;
  }
  .bottom-nav button .ic { font-size: 20px; margin-bottom: 2px; filter: grayscale(1); opacity: 0.7; transition: 0.2s; }
  .bottom-nav button.active { color: var(--accent); }
  .bottom-nav button.active .ic { filter: grayscale(0); opacity: 1; transform: translateY(-1px); }
  .bottom-nav button.active::before {
    content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px; border-radius: 0 0 4px 4px; background: var(--accent);
  }

  /* ---------- VIEWS ---------- */
  .view { display: none; }
  .view.active { display: block; animation: fadeUp 0.25s ease-out; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- MAP ---------- */
  .map-wrap { position: relative; background: #FFF; box-shadow: 0 2px 8px rgba(0,0,0,0.03); z-index: 10; }
  #overview-map { width: 100%; height: 25vh; min-height: 180px; background: #EDF1F5; }
  
  .day-pills {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--line);
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill {
    flex: 0 0 auto; padding: 8px 14px; border-radius: 10px;
    background: var(--paper-2); color: var(--ink-soft); font-size: 13px;
    font-weight: 700; cursor: pointer; transition: 0.2s; border: 1px solid transparent;
  }
  .day-pill .wk { opacity: 0.6; margin-left: 2px; font-size: 11px; font-weight: 500;}
  .day-pill.active {
    background: #FFF1EE; color: var(--accent); border-color: var(--accent);
  }

  /* ---------- DAY CONTENT ---------- */
  .day-panel { display: none; padding: 16px 16px 10px; }
  .day-panel.active { display: block; }

  .day-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .day-head .num { font-size: 22px; font-weight: 900; color: var(--ink); }
  .day-head .wk { color: var(--accent-2); font-size: 14px; font-weight: 800; }
  .day-title { color: var(--ink-soft); font-size: 14px; margin: 0 0 16px; font-weight: 500; }

  .hotel-banner {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #FDF4E7, #F8EAD6); 
    border-radius: 12px; padding: 10px 12px; margin-bottom: 16px;
    border: 1px solid rgba(209,145,66,0.2);
  }
  .hotel-banner .ic { font-size: 20px; }
  .hotel-banner .txt { flex: 1; font-size: 13px; font-weight: 700; color: #8A5F20; }
  .hotel-banner a { 
    color: #FFF; background: #D19142; padding: 4px 10px; border-radius: 16px;
    text-decoration: none; font-size: 12px; font-weight: 700; white-space: nowrap;
  }

  .timeline { position: relative; padding-left: 2px; }
  .item { position: relative; display: flex; gap: 12px; padding: 0 0 20px 0; }
  .item::before {
    content: ""; position: absolute; left: 15px; top: 32px; bottom: -2px; width: 2px;
    background: var(--line); border-radius: 2px;
  }
  .item:last-child::before { display: none; }
  .item .badge {
    flex: 0 0 32px; height: 32px; border-radius: 10px;
    background: #FFF; border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    z-index: 1; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }
  .item .body { flex: 1; padding-top: 2px; }
  .item .time { font-size: 12px; color: var(--accent); font-weight: 800; margin-bottom: 2px; }
  .item .name { font-size: 15px; font-weight: 800; margin: 0 0 4px; color: var(--ink); line-height: 1.35; }
  .item .note { font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; line-height: 1.4; font-weight: 500; }
  .item .note.warn { color: var(--accent); background: #FFF1EE; padding: 4px 8px; border-radius: 6px; display: inline-block;}
  .item .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .item .links a {
    font-size: 11px; text-decoration: none; color: var(--ink);
    background: #FFF; border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 16px; font-weight: 700;
    display: flex; align-items: center; gap: 4px;
  }
  .item .links a.map-link { color: var(--blue); border-color: #CBD5E1; background: #F1F5F9; }
  .item .links a.off-link { color: var(--green); border-color: #C6F6D5; background: #F0FFF4; }

  .candidate-card {
    margin: 0 16px 20px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; box-shadow: var(--shadow);
  }
  .candidate-card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 800; }
  .candidate-card p.hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 10px; }
  .candidate-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .candidate-list a {
    font-size: 12px; text-decoration: none; color: var(--ink);
    background: var(--paper-2); padding: 6px 12px; border-radius: 16px; font-weight: 700;
    border: 1px solid transparent;
  }

  /* ---------- CONVERT & PHRASE GENERAL ---------- */
  .inner { padding: 16px 16px 24px; }
  .section-title { margin: 0 0 2px; font-size: 18px; font-weight: 900; }
  .section-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 12px; font-weight: 500; }
  
  .conv-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .conv-card h3 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; font-weight: 800; }
  .conv-row { margin-bottom: 12px; }
  .conv-row label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; font-weight: 600; }
  
  .conv-input-wrap { 
    display: flex; align-items: stretch; border: 2px solid var(--line); 
    border-radius: 10px; overflow: hidden; background: #FFF; transition: 0.2s;
  }
  .conv-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(226,91,54,0.15); }
  .conv-input-wrap span { 
    padding: 0 10px; font-size: 14px; color: var(--ink-soft); 
    background: var(--paper-2); display: flex; align-items: center; font-weight: 800; 
  }
  .conv-input-wrap input {
    flex: 1; border: none; padding: 8px 10px; font-size: 17px; font-family: inherit;
    background: transparent; color: var(--ink); font-weight: 800; min-width: 0;
  }
  .conv-input-wrap input:focus { outline: none; }
  .conv-swap { text-align: center; color: var(--accent-2); font-size: 16px; margin: 2px 0 12px; font-weight: 800; }

  .rate-row { 
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); 
    flex-wrap: wrap; margin-bottom: 8px; font-weight: 600; background: #F8F9FA; padding: 8px; border-radius: 8px;
  }
  .rate-row input { 
    width: 85px; padding: 4px 6px; border-radius: 6px; border: 2px solid var(--line); 
    font-family: inherit; font-size: 13px; font-weight: 800; text-align: center; color: var(--blue);
  }
  .live-tag { background: #48BB78; color: #FFF; padding: 2px 4px; border-radius: 4px; font-size: 9px; font-weight: 800; margin-left: 4px;}

  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .toggle-row .lbl { font-size: 13px; font-weight: 700; color: var(--ink); }
  .toggle-row .lbl small { display: block; font-size: 11px; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 24px; flex: 0 0 44px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #CBD5E1; border-radius: 999px; transition: .2s; cursor: pointer; }
  .switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #FFF; border-radius: 50%; transition: .2s; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .pct-row { display: flex; gap: 10px; margin-bottom: 8px; }
  .pct-field { flex: 1; }
  .pct-field label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; font-weight: 600; }
  .pct-input-wrap { 
    display: flex; align-items: center; border: 2px solid var(--line); 
    border-radius: 10px; overflow: hidden; background: #FFF; transition: 0.2s;
  }
  .pct-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(226,91,54,0.15); }
  .pct-input-wrap input { 
    flex: 1; border: none; padding: 8px 10px; font-size: 16px; font-family: inherit; 
    background: transparent; color: var(--ink); font-weight: 800; min-width: 0; 
  }
  .pct-input-wrap input:focus { outline: none; }
  .pct-input-wrap span { padding: 0 10px; color: var(--ink-soft); font-size: 13px; font-weight: 800; background: var(--paper-2); height: 100%; display: flex; align-items: center;}
  
  .pct-presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
  .pct-presets button {
    border: 2px solid var(--line); background: #FFF; color: var(--ink-soft);
    font-size: 12px; padding: 4px 10px; border-radius: 16px; font-family: inherit; 
    cursor: pointer; font-weight: 700; transition: 0.2s;
  }
  .pct-presets button.active { background: #FFF1EE; border-color: var(--accent); color: var(--accent); }

  .result-box {
    margin-top: 8px; background: linear-gradient(135deg, #2C3E50, #1A2536); 
    border-radius: 12px; padding: 10px 14px; color: #FFF;
    box-shadow: 0 6px 12px rgba(26,37,54,0.15);
  }
  .result-box .row { display: flex; justify-content: space-between; font-size: 12px; color: #94A3B8; padding: 4px 0; font-weight: 600; }
  .result-box .row span:last-child { color: #E2E8F0; }
  .result-box .row.final { 
    font-size: 16px; font-weight: 900; color: #FFF; 
    border-top: 1px dashed rgba(255,255,255,0.2); margin-top: 6px; padding-top: 10px; 
  }
  .result-box .row.final span:last-child { color: #F6AD55; font-size: 18px; }
  .conv-note { font-size: 11px; color: #8BA0B8; line-height: 1.5; font-weight: 500; text-align: center; margin-top: 6px; }

  /* ---------- PHRASEBOOK ---------- */
  .phrase-tabs { 
    display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; 
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 4px;
  }
  .phrase-tabs::-webkit-scrollbar { display: none; }
  .phrase-tab {
    flex: 0 0 auto; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--line);
    background: #FFF; color: var(--ink-soft); font-size: 13px; font-weight: 700; 
    cursor: pointer; transition: 0.2s;
  }
  .phrase-tab.active { background: var(--ink); border-color: var(--ink); color: #FFF; }
  
  .phrase-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
  }
  .phrase-card:active { transform: scale(0.98); }
  .phrase-card .txt { flex: 1; }
  .phrase-card .ja { font-size: 16px; font-weight: 800; margin: 0 0 4px; color: var(--ink); }
  .phrase-card .kana { font-size: 11px; color: var(--accent-2); margin: 0 0 4px; font-weight: 600; font-family: monospace; }
  .phrase-card .zh { font-size: 13px; color: var(--ink-soft); margin: 0; font-weight: 500; }
  
  .speak-btn {
    flex: 0 0 44px; height: 44px; border-radius: 50%; border: none;
    background: #FFF1EE; color: var(--accent); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(226,91,54,0.1); transition: 0.2s;
  }
  .speak-btn.playing { background: var(--accent); color: #FFF; transform: scale(1.1); }
  .phrase-note { font-size: 11px; color: #8BA0B8; margin-top: 16px; line-height: 1.5; font-weight: 500; text-align: center; }

  /* ---------- FLASHCARD MODAL ---------- */
  #flashcard-modal {
    position: fixed; inset: 0; background: rgba(31,42,61,0.95); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: 0.25s ease-out;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #flashcard-modal.show { opacity: 1; pointer-events: auto; }
  .fc-content { text-align: center; max-width: 95vw; }
  .fc-ja { font-size: 10vw; font-weight: 900; color: #FFF; margin: 0 0 16px; line-height: 1.3; }
  @media(min-width: 500px) { .fc-ja { font-size: 50px; } }
  .fc-kana { font-size: 16px; color: #F0C48D; margin: 0 0 16px; font-weight: 600; font-family: monospace; }
  .fc-zh { font-size: 20px; color: #A0ABC0; margin: 0; font-weight: 500; }
  .fc-close {
    position: absolute; top: 30px; right: 20px; background: rgba(255,255,255,0.2);
    border: none; color: #FFF; width: 40px; height: 40px; border-radius: 50%;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<header class="hero">
  <p class="eyebrow">JAPAN TRIP</p>
  <h1>東京・富士五湖 秋日行</h1>
  <p class="dates">2026.10.02（五）— 10.09（五）・8天7夜</p>
</header>

<!-- ===================== 行程 VIEW ===================== -->
<section id="view-itinerary" class="view active">
  <div class="map-wrap">
    <div id="overview-map"></div>
    <div class="day-pills" id="day-pills"></div>
  </div>
  <div id="day-panels"></div>
  <div class="candidate-card">
    <h3>🍽️ 候補餐廳（機動安排）</h3>
    <div class="candidate-list" id="candidate-list"></div>
  </div>
</section>

<!-- ===================== 換算 VIEW ===================== -->
<section id="view-convert" class="view">
  <div class="inner">
    <h2 class="serif section-title">日圓／台幣 換算</h2>
    <p class="section-sub">即時抓取匯率，或自訂計算</p>

    <div class="conv-card">
      <h3>💱 快速雙向換算</h3>
      <div class="conv-row">
        <label>日圓 JPY</label>
        <div class="conv-input-wrap"><span>¥</span><input type="number" id="jpy-input" inputmode="decimal" pattern="[0-9]*" placeholder="0"></div>
      </div>
      <div class="conv-swap">↕ 使用下方同一組匯率</div>
      <div class="conv-row" style="margin-bottom:0;">
        <label>台幣 TWD</label>
        <div class="conv-input-wrap"><span>NT$</span><input type="number" id="twd-input" inputmode="decimal" pattern="[0-9]*" placeholder="0"></div>
      </div>
    </div>

    <div class="conv-card">
      <h3>🛍️ 購物實付估算</h3>
      <div class="conv-row">
        <label>商品標價（日圓）</label>
        <div class="conv-input-wrap">
          <span>¥</span>
          <input type="number" id="shop-jpy" inputmode="decimal" pattern="[0-9]*" placeholder="0">
        </div>
      </div>

      <div class="pct-row">
        <div class="pct-field">
          <label>優惠券折扣</label>
          <div class="pct-input-wrap"><input type="number" id="discount-pct" value="0" min="0" max="100" step="1" inputmode="decimal" pattern="[0-9]*"><span>%</span></div>
        </div>
        <div class="pct-field">
          <label>退稅</label>
          <div class="pct-input-wrap"><input type="number" id="taxrefund-pct" value="0" min="0" max="100" step="0.5" inputmode="decimal" pattern="[0-9]*"><span>%</span></div>
          <div class="pct-presets" id="refund-presets"></div>
        </div>
      </div>

      <div class="toggle-row">
        <div class="lbl">海外刷卡手續費<small>預設 1.5%，未勾選則不計入</small></div>
        <label class="switch"><input type="checkbox" id="fee-toggle" checked><span class="slider"></span></label>
      </div>

      <div class="rate-row">
        1 JPY = <input type="number" id="rate-input" step="0.0001" value="0.2100" inputmode="decimal"> TWD
        <span class="live-tag" id="live-tag">更新中...</span>
      </div>

      <div class="result-box">
        <div class="row"><span>折扣後金額</span><span id="r-after-discount">¥0</span></div>
        <div class="row"><span>退稅後（日圓）</span><span id="r-after-refund">¥0</span></div>
        <div class="row"><span>刷卡手續費</span><span id="r-fee">＋NT$0</span></div>
        <div class="row final"><span>台幣實付估算</span><span id="r-final">NT$0</span></div>
      </div>
    </div>
    
    <p class="conv-note">匯率每日變動，結果僅供旅途中概略估算參考。</p>
  </div>
</section>

<!-- ===================== 日文 VIEW ===================== -->
<section id="view-phrase" class="view">
  <div class="inner">
    <h2 class="serif section-title">日文萬用句</h2>
    <p class="section-sub">點擊卡片可放大顯示，按 🔊 播放發音</p>
    <div class="phrase-tabs" id="phrase-tabs"></div>
    <div id="phrase-list"></div>
  </div>
</section>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="itinerary">
    <span class="ic">🗺️</span>行程
  </button>
  <button class="nav-btn" data-view="convert">
    <span class="ic">💱</span>換算
  </button>
  <button class="nav-btn" data-view="phrase">
    <span class="ic">🗣️</span>日文
  </button>
</nav>

<!-- ===================== FLASHCARD MODAL ===================== -->
<div id="flashcard-modal">
  <button class="fc-close" id="fc-close">✕</button>
  <div class="fc-content">

  html += '<div class="timeline">';
  d.items.forEach(it=>{
    html += '<div class="item">';
    html += '<div class="badge">'+it.icon+'</div>';
    html += '<div class="body">';
    if(it.time) html += '<div class="time">'+it.time+'</div>';

    if(it.link) html += '<a class="off-link" href="'+it.link+'" target="_blank" rel="noopener">🔗 連結</a>';
    html += '</div></div></div>';
  });
  html += '</div>';

  panel.innerHTML = html;

function selectDay(i){
  document.querySelectorAll(".day-pill").forEach(p=> p.classList.toggle("active", +p.dataset.idx===i));
  document.querySelectorAll(".day-panel").forEach(p=> p.classList.toggle("active", +p.dataset.idx===i));
  const pill = document.querySelector('.day-pill[data-idx="'+i+'"]');
  if(pill) pill.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  renderMapForDay(i);
}

/* ============ map ============ */
function initMap(){
  map = L.map("overview-map", {zoomControl:false, attributionControl:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:18 }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  renderMapForDay(0);
}

function renderMapForDay(i){
  if(!map) return;
  markerLayer.clearLayers();
  const pts = days[i].items.filter(it=>it.big);
  if(pts.length===0){
    map.setView([35.68,139.75], 10);
    return;
  }
  const bounds = [];
  pts.forEach(it=>{
    const m = L.circleMarker([it.big.lat, it.big.lng], {
      radius:7, color:"#FFFFFF", weight:2, fillColor:"#E25B36", fillOpacity:0.9
    }).addTo(markerLayer);
    m.bindPopup('<b>'+it.name+'</b><br><a href="'+mapsLink(it.mapQuery)+'" target="_blank" rel="noopener">在地圖開啟</a>');
    bounds.push([it.big.lat, it.big.lng]);
  });
  if(bounds.length===1){
    map.setView(bounds[0], 13);
  } else {
    map.fitBounds(bounds, {padding:[30,30]});
  }
}
initMap();

/* ============ currency: shopping estimator ============ */
const shopJpy = document.getElementById("shop-jpy");
const discountPct = document.getElementById("discount-pct");
const refundPct = document.getElementById("taxrefund-pct");
const feeToggle = document.getElementById("fee-toggle");
const rAfterDiscount = document.getElementById("r-after-discount");
const rAfterRefund = document.getElementById("r-after-refund");
const rFee = document.getElementById("r-fee");
const rFinal = document.getElementById("r-final");

const refundPresetsWrap = document.getElementById("refund-presets");
[0,5,8,10].forEach(v=>{
  const b = document.createElement("button");
  b.type="button"; b.textContent = v+"%";
  if(v===0) b.classList.add("active");
  b.addEventListener("click", ()=>{
    refundPct.value = v;
    refundPresetsWrap.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    recalcShop();
  });
  refundPresetsWrap.appendChild(b);
});
refundPct.addEventListener("input", ()=>{
  refundPresetsWrap.querySelectorAll("button").forEach(x=> x.classList.toggle("active", x.textContent === (refundPct.value+"%")));
});

function fmtJPY(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }
function fmtTWD(n){ return "NT$" + n.toLocaleString("zh-TW", {maximumFractionDigits:0, minimumFractionDigits:0}); }

function recalcShop(){
  const base = parseFloat(shopJpy.value) || 0;
  const disc = parseFloat(discountPct.value) || 0;
  const refund = parseFloat(refundPct.value) || 0;
  const rate = parseFloat(rateInput.value) || 0;
  const feeOn = feeToggle.checked;

  const afterDiscount = base * (1 - disc/100);
  const afterRefund = afterDiscount * (1 - refund/100);
  const twdBeforeFee = afterRefund * rate;
  const fee = feeOn ? twdBeforeFee * 0.015 : 0;
  const finalTwd = twdBeforeFee + fee;

  rAfterDiscount.textContent = fmtJPY(afterDiscount);
  rAfterRefund.textContent = fmtJPY(afterRefund);
  rFee.textContent = feeOn ? ("＋" + fmtTWD(fee)) : "未計入";
  rFinal.textContent = fmtTWD(finalTwd);
}
[shopJpy, discountPct, refundPct, rateInput].forEach(el=> el.addEventListener("input", recalcShop));
feeToggle.addEventListener("change", recalcShop);
recalcShop();

/* ============ currency: quick bidirectional ============ */
const jpyInput = document.getElementById("jpy-input");
const twdInput = document.getElementById("twd-input");
let lastEdited = "jpy";
function recalcQuick(){
  const rate = parseFloat(rateInput.value) || 0;
  if(lastEdited==="jpy"){
    const jpy = parseFloat(jpyInput.value);
    twdInput.value = isNaN(jpy) ? "" : Math.round(jpy*rate);
  } else {
    const twd = parseFloat(twdInput.value);
    jpyInput.value = (isNaN(twd) || rate===0) ? "" : Math.round(twd/rate);
  }
}
jpyInput.addEventListener("input", ()=>{ lastEdited="jpy"; recalcQuick(); });
twdInput.addEventListener("input", ()=>{ lastEdited="twd"; recalcQuick(); });
rateInput.addEventListener("input", recalcQuick);

const phraseTabsWrap = document.getElementById("phrase-tabs");
const phraseListWrap = document.getElementById("phrase-list");
const categories = Object.keys(phraseData);

// Modal DOM
const fcModal = document.getElementById("flashcard-modal");
const fcJa = document.getElementById("fc-ja");
const fcKana = document.getElementById("fc-kana");
const fcZh = document.getElementById("fc-zh");
const fcClose = document.getElementById("fc-close");

fcClose.addEventListener("click", () => fcModal.classList.remove("show"));
fcModal.addEventListener("click", (e) => {
  if (e.target === fcModal) fcModal.classList.remove("show");
});

function renderPhrases(cat){
  phraseListWrap.innerHTML = "";
  phraseData[cat].forEach(p=>{
    const card = document.createElement("div");
    card.className = "phrase-card";
    card.innerHTML =
      '<div class="txt"><p class="ja">'+p.ja+'</p><p class="kana">'+p.kana+'</p><p class="zh">'+p.zh+'</p></div>'+
      '<button class="speak-btn" aria-label="播放發音">🔊</button>';
    
    // Open modal on card click
    card.addEventListener("click", (e)=>{
      // If clicking the speak button, ignore modal
      if(e.target.closest(".speak-btn")) return;
      fcJa.textContent = p.ja;
      fcKana.textContent = p.kana;
      fcZh.textContent = p.zh;
      fcModal.classList.add("show");
    });

    const btn = card.querySelector(".speak-btn");
    btn.addEventListener("click", (e)=> {
      e.stopPropagation();
      speakJapanese(p.ja, btn);
    });
    phraseListWrap.appendChild(card);
  });
}

categories.forEach((cat,i)=>{
  const tab = document.createElement("div");
  tab.className = "phrase-tab" + (i===0 ? " active":"");
  tab.textContent = cat;
  tab.addEventListener("click", ()=>{
    phraseTabsWrap.querySelectorAll(".phrase-tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    renderPhrases(cat);
  });
  phraseTabsWrap.appendChild(tab);
});
renderPhrases(categories[0]);

function speakJapanese(text, btn){
  if(!("speechSynthesis" in window)){
    alert("此瀏覽器不支援語音朗讀功能");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP";
  utter.rate = 0.9;
  btn.classList.add("playing");
  utter.onend = ()=> btn.classList.remove("playing");
  utter.onerror = ()=> btn.classList.remove("playing");
  window.speechSynthesis.speak(utter);
}
</script>
